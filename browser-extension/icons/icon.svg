<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="innerShadow">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="3"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#0a0520"/>
  <circle cx="256" cy="256" r="240" fill="url(#shieldGrad)" opacity="0.08"/>

  <!-- Shield shape -->
  <path d="M256 60 L400 130 L400 260 C400 370 340 430 256 460 C172 430 112 370 112 260 L112 130 Z"
    fill="url(#shieldGrad)" opacity="0.15" filter="url(#glow)"/>

  <!-- Shield outline -->
  <path d="M256 80 L380 140 L380 255 C380 355 328 410 256 438 C184 410 132 355 132 255 L132 140 Z"
    fill="none" stroke="url(#shieldGrad)" stroke-width="12" stroke-linejoin="round"
    filter="url(#glow)"/>

  <!-- Inner shield detail -->
  <path d="M256 120 L350 170 L350 250 C350 330 310 375 256 398 C202 375 162 330 162 250 L162 170 Z"
    fill="none" stroke="url(#shieldGrad)" stroke-width="3" opacity="0.3" stroke-linejoin="round"/>

  <!-- Lock body -->
  <rect x="210" y="270" width="92" height="75" rx="14" fill="url(#shieldGrad)" filter="url(#innerShadow)"/>

  <!-- Lock shackle -->
  <path d="M226 270 L226 235 C226 200 256 180 256 180 C256 180 286 200 286 235 L286 270"
    fill="none" stroke="url(#shieldGrad)" stroke-width="16" stroke-linecap="round"/>

  <!-- Keyhole circle -->
  <circle cx="256" cy="300" r="12" fill="white" opacity="0.9"/>

  <!-- Keyhole slot -->
  <rect x="251" y="308" width="10" height="22" rx="5" fill="white" opacity="0.9"/>
</svg>
